[package]
name = "lumen-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lumen-core.workspace = true
symphonia = { version = "=0.6.1", default-features = false, features = ["flac", "mp3", "isomp4", "alac", "wav", "pcm", "vorbis", "ogg"] }
rubato = "=5.1.0"
rtrb = "=0.4.1"
crossbeam-channel = "=0.5.17"
tracing = "=0.1.44"
# Only used by the lumen-play CLI.
walkdir = "=2.5.1"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[target.'cfg(windows)'.dependencies]
wasapi = "=0.27.0"
windows = { version = "=0.62.2", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Media_Audio"] }

[dev-dependencies]
flacenc = "=0.5.1"

[[bin]]
name = "lumen-play"
path = "src/bin/lumen-play.rs"

[lints]
workspace = true
