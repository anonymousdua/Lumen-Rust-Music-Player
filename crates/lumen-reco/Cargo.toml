[package]
name = "lumen-reco"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lumen-core.workspace = true
lumen-library.workspace = true
# Audio analysis. FFmpeg is the default decoder: it stays off, and bliss
# decodes with Symphonia (pure Rust) for the formats Lumen plays.
bliss-audio = { version = "=0.13.0", default-features = false, features = [
    "symphonia-flac",
    "symphonia-mp3",
    "symphonia-alac",
    "symphonia-wav",
    "symphonia-ogg",
    "symphonia-vorbis",
] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
crossbeam-channel = "=0.5.17"
tracing = "=0.1.44"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Time",
] }

[lints]
workspace = true
