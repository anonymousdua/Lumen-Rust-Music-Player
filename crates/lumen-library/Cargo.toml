[package]
name = "lumen-library"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lumen-core.workspace = true
lofty = "=0.25.5"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
